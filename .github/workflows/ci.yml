name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install tested Codex CLI
        shell: pwsh
        run: npm install --global @openai/codex@0.147.0

      - name: Validate package
        shell: pwsh
        run: ./tests/Validate-Package.ps1

      - name: Run isolated safety tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: Build install-ready archive
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Force

      - name: Upload tested archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-safe-setup
          path: dist/*.zip
          if-no-files-found: error
