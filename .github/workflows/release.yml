name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install tested Codex CLI
        shell: pwsh
        run: npm install --global @openai/codex@0.147.0

      - name: Validate and test
        shell: pwsh
        run: |
          ./tests/Validate-Package.ps1
          ./tests/Run-Tests.ps1

      - name: Build release archive
        shell: pwsh
        run: |
          $manifest = Get-Content ./.codex-plugin/plugin.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ("${{ inputs.tag }}" -ne $expectedTag) {
            throw "Requested tag must match manifest version: $expectedTag"
          }
          ./tools/Build-Release.ps1 -Force

      - name: Upload archive to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath ./dist -File)
          if ($assets.Count -ne 2) {
            throw 'Expected one release archive and one SHA-256 checksum.'
          }
          foreach ($asset in $assets) {
            gh release upload "${{ inputs.tag }}" $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($asset.Name)."
            }
          }
