name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install tested Codex CLI
        shell: pwsh
        run: npm install --global @openai/codex@0.147.0

      - name: Validate and test
        shell: pwsh
        run: |
          ./tests/Validate-Package.ps1
          ./tests/Run-Tests.ps1

      - name: Build release archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $manifest = Get-Content ./.codex-plugin/plugin.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Requested tag must match manifest version: $expectedTag"
          }
          ./tools/Build-Release.ps1 -Force

      - name: Create GitHub release and upload tested assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --generate-notes --title "Codex Safe Setup $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $env:RELEASE_TAG."
            }
          }
          $assets = @(Get-ChildItem -LiteralPath ./dist -File)
          if ($assets.Count -ne 2) {
            throw 'Expected one release archive and one SHA-256 checksum.'
          }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($asset.Name)."
            }
          }
